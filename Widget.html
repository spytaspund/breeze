<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Modern Weather Widget</title>
    <style>
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Ultralight.ttf') format('truetype'); font-weight: 100; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Thin.ttf') format('truetype'); font-weight: 200; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Light.ttf') format('truetype'); font-weight: 300; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Regular.ttf') format('truetype'); font-weight: 400; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Medium.ttf') format('truetype'); font-weight: 500; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Semibold.ttf') format('truetype'); font-weight: 600; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Bold.ttf') format('truetype'); font-weight: 700; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Heavy.ttf') format('truetype'); font-weight: 800; font-style: normal; }
        @font-face { font-family: 'SF Pro Display'; src: url('fonts/SF-Pro-Display-Black.ttf') format('truetype'); font-weight: 900; font-style: normal; }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; }
        body { font-family: 'SF Pro Display', -apple-system, sans-serif; color: #ffffff; background-color: transparent; }
        #widget-container { width: 148px; height: auto; position: absolute; top: 0; left: 0; }
        
        .weather-card { 
            width: 148px; height: 148px; border-radius: 20px; padding: 12px 16px; 
            display: flex; flex-direction: column; justify-content: space-between; 
            background-color: #3a7bd5; 
            position: relative; z-index: 10; transition: background 0.5s ease;
        }

        .bg-cloudy { background: linear-gradient(180deg, #8391a0, #576876); }
        .bg-sunny  { background: linear-gradient(180deg, #2980B9, #6DD5FA); }
        .bg-night  { background: linear-gradient(180deg, #010521, #2d3654); }
        .bg-dusk   { background: linear-gradient(180deg, #2f4276, #b68870); }

        .top-section, .bottom-section { display: flex; flex-direction: column; }
        .location-row { display: flex; align-items: center; margin-bottom: 1px; }
        .location-name { font-size: 16px; font-weight: 500; letter-spacing: 0.45px; margin-right: 3px; }
        .location-icon { width: 10px; height: 10px; margin-top: 1px; }
        .current-temp { font-size: 40px; font-weight: 300; line-height: 1.0; letter-spacing: 0.3px; margin-left: -1px; }
        
        .raw-icon { opacity: 1; }
        .weather-icon { width: 18px; height: 18px; margin-bottom: -2px; margin-top: 10px; }
        
        .condition { font-size: 14px; font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.3px; }
        .high-low { font-size: 13px; font-weight: 500; opacity: 1; text-shadow: 0 1px 2px rgba(0,0,0,0.1); letter-spacing: 0.5px; display: flex; align-items: center; }
        .arrow-icon { width: 10px; height: 10px; margin: 0 3px 0 0; }
        .arrow-up { margin-left: 6px; }
        .widget-label { width: 100%; text-align: center; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 400; margin-top: 4px; color: #ffffff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4); letter-spacing: 0.3px; }
    </style>
</head>
<body>

    <div id="widget-container">
        <div id="card" class="weather-card bg-night">
            <div class="top-section">
                <div class="location-row">
                    <span id="loc-display" class="location-name">Местоположение</span>
                    <img class="location-icon raw-icon" src="icons/location-fill.svg">
                </div>
                <div id="temp" class="current-temp">--&deg;</div>
            </div>

            <div class="bottom-section">
                <div id="icon-wrapper">
                    <div style="width:18px;height:18px;margin-bottom:-2px;"></div>
                </div>
                <div id="condition" class="condition">Загрузка...</div>
                <div id="forecast" class="high-low">
                    <img class="arrow-icon raw-icon" src="icons/arrow-down.svg">--&deg;
                    <img class="arrow-icon arrow-up raw-icon" src="icons/arrow-up.svg">--&deg;
                </div>
            </div>
        </div>
        <div class="widget-label">Погода</div>
    </div>

    <script>
        var iconPack = {
            clearDay: '<img class="raw-icon weather-icon" src="icons/sun-max-fill.svg">',
            clearNight: '<img class="raw-icon weather-icon" src="icons/moon-stars-fill.svg">',
            pCloudyDay: '<img class="raw-icon weather-icon" src="icons/cloud-sun-fill.svg">',
            pCloudyNight: '<img class="raw-icon weather-icon" src="icons/cloud-moon-fill.svg">',
            cloudy: '<img class="raw-icon weather-icon" src="icons/cloud-fill.svg">',
            drizzle: '<img class="raw-icon weather-icon" src="icons/cloud-rain-fill.svg">',
            rainDay: '<img class="raw-icon weather-icon" src="icons/cloud-sun-rain-fill.svg">',
            rainNight: '<img class="raw-icon weather-icon" src="icons/cloud-moon-rain-fill.svg">',
            heavyRain: '<img class="raw-icon weather-icon" src="icons/cloud-heavyrain-fill.svg">',
            thunderstorms: '<img class="raw-icon weather-icon" src="icons/cloud-bolt-rain-fill.svg">',
            snow: '<img class="raw-icon weather-icon" src="icons/cloud-snow-fill.svg">',
            sleet: '<img class="raw-icon weather-icon" src="icons/cloud-sleet-fill.svg">',
            fog: '<img class="raw-icon weather-icon" src="icons/cloud-fog-fill.svg">'
        };

        function getWeatherData(condCode, isDay) {
            if (!isDay) {
                if (condCode === 'clear') return { text: 'Ясно', bg: 'bg-night', icon: iconPack.clearNight };
                if (condCode === 'partly-cloudy') return { text: 'Малооблачно', bg: 'bg-night', icon: iconPack.pCloudyNight };
                if (condCode === 'rain' || condCode === 'light-rain') return { text: 'Дождь', bg: 'bg-night', icon: iconPack.rainNight };
            }
            if (condCode === 'partly-cloudy') return isDay ? { text: 'Малооблачно', bg: 'bg-dusk', icon: iconPack.pCloudyDay } : { text: 'Малооблачно', bg: 'bg-night', icon: iconPack.pCloudyNight };
            if (condCode === 'clear') return isDay ? { text: 'Ясно', bg: 'bg-sunny', icon: iconPack.clearDay } : { text: 'Ясно', bg: 'bg-night', icon: iconPack.clearNight };
            if (condCode === 'cloudy' || condCode === 'overcast') return { text: 'Облачно', bg: 'bg-cloudy', icon: iconPack.cloudy };
            if (condCode === 'rain' || condCode === 'light-rain') return isDay ? { text: 'Дождь', bg: 'bg-cloudy', icon: iconPack.rainDay } : { text: 'Дождь', bg: 'bg-night', icon: iconPack.rainNight };
            if (condCode.indexOf('heavy') !== -1 || condCode === 'showers') return { text: 'Ливень', bg: 'bg-cloudy', icon: iconPack.heavyRain };
            if (condCode === 'drizzle') return { text: 'Морось', bg: 'bg-cloudy', icon: iconPack.drizzle };
            if (condCode.indexOf('snow') !== -1) { if (condCode === 'wet-snow') return { text: 'Мокрый снег', bg: 'bg-cloudy', icon: iconPack.sleet }; return { text: 'Снег', bg: 'bg-cloudy', icon: iconPack.snow }; }
            if (condCode.indexOf('thunderstorm') !== -1) return { text: 'Гроза', bg: 'bg-night', icon: iconPack.thunderstorms };
            if (condCode === 'fog') return { text: 'Туман', bg: 'bg-cloudy', icon: iconPack.fog };
            return { text: 'Пасмурно', bg: 'bg-cloudy', icon: iconPack.cloudy };
        }

        function updateLocationByIP() {
            var xhr = new XMLHttpRequest();
            var url = "http://ip-api.com/json/?lang=ru";
            
            xhr.open("GET", url, true);
            xhr.timeout = 4000; 

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        try {
                            var response = JSON.parse(xhr.responseText);
                            console.log("IP Geolocation Success: ", response);
                            var cityName = response.city;
                        
                            if (cityName) {
                                document.getElementById("loc-display").innerText = cityName;
                            }
                        } catch (e) {
                            console.log("Error parsing IP Geo response");
                        }
                    } else {
                        console.log("IP API status error: " + xhr.status);
                    }
                }
            };

            xhr.ontimeout = function () { console.log("IP API Timeout"); };
            xhr.onerror = function () { console.log("IP API Net Error"); };

            xhr.send();
        }

        function loadAndParseWeather() {
            var oldScript = document.getElementById('weather-data-script');
            if (oldScript) oldScript.remove();

            var script = document.createElement('script');
            script.id = 'weather-data-script';
            script.src = 'weather.js';
            
            script.onload = function() {
                try {
                    if (typeof weatherData !== 'undefined' && weatherData.fact) {
                        var data = weatherData;
                        var currentTemp = data.fact.temp;
                        document.getElementById("temp").innerHTML = currentTemp + "&deg;";
                        
                        var isDay = data.fact.daytime === 'd';
                        var matched = getWeatherData(data.fact.condition, isDay);
                        
                        document.getElementById("condition").innerText = matched.text;
                        document.getElementById("card").className = "weather-card " + matched.bg;
                        document.getElementById("icon-wrapper").innerHTML = matched.icon;
                        
                        if (data.forecasts && data.forecasts[0] && data.forecasts[0].parts) {
                            var parts = data.forecasts[0].parts;
                            var minTemp = parts.night_short ? parts.night_short.temp : (parts.night ? parts.night.temp_min : 0);
                            var maxTemp = parts.day_short ? parts.day_short.temp : (parts.day ? parts.day.temp_max : 0);
                            
                            if (minTemp === undefined || maxTemp === undefined) {
                                minTemp = parts.day.temp_min; maxTemp = parts.day.temp_max;
                            }

                            document.getElementById("forecast").innerHTML = 
                                '<img class="arrow-icon raw-icon" src="icons/arrow-down.svg">' + minTemp + '&deg;' + 
                                '<img class="arrow-icon arrow-up raw-icon" src="icons/arrow-up.svg">' + maxTemp + '&deg;';
                        }
                    }
                } catch (e) {}
            };
            document.body.appendChild(script);
        }
        updateLocationByIP(); 
        loadAndParseWeather();
        setInterval(loadAndParseWeather, 1000); 
        setInterval(updateLocationByIP, 3600000);
    </script>
</body>
</html>
